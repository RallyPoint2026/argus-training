<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #header { position: absolute; top: 40px; width: 100%; text-align: center; z-index: 10; }
        #question { font-size: 36px; color: #ffcc00; font-weight: bold; max-width: 80%; margin: 0 auto; text-transform: uppercase; }
        .container { display: flex; justify-content: space-around; align-items: flex-end; height: 100vh; padding: 0 5% 100px 5%; box-sizing: border-box; }
        .box { width: 22%; border: 2px solid #333; border-radius: 15px; text-align: center; padding: 40px 15px; transition: all 0.4s ease; position: relative; min-height: 140px; background: rgba(30,30,30,0.9); }
        .label { font-size: 26px; font-weight: 700; line-height: 1.2; }
        .box-letter { font-size: 60px; color: rgba(255,255,255,0.03); position: absolute; bottom: 5px; right: 15px; font-weight: 900; }
        .correct-glow { border-color: #00ff00 !important; box-shadow: 0 0 40px rgba(0, 255, 0, 0.6); background: rgba(0, 255, 0, 0.15) !important; color: #00ff00 !important; }
    </style>
</head>
<body>
    <div id="header"><div id="question">SYNCHRONIZING WITH SHEET...</div></div>
    <div class="container">
        <div id="boxA" class="box"><div id="textA" class="label"></div><div class="box-letter">A</div></div>
        <div id="boxB" class="box"><div id="textB" class="label"></div><div class="box-letter">B</div></div>
        <div id="boxC" class="box"><div id="textC" class="label"></div><div class="box-letter">C</div></div>
        <div id="boxD" class="box"><div id="textD" class="label"></div><div class="box-letter">D</div></div>
    </div>

    <script>
        const SHEET_ID = '16aJUFj5ql8OnEbTOEgHPque-_8L5Ylu4P7VDC4t1CoM';
        const urlParams = new URLSearchParams(window.location.search);
        const scenarioID = urlParams.get('id') || '10SBV01'; 

        async function fetchScenarioData() {
            try {
                // Simplified URL that pulls the first sheet as a CSV (much more reliable than JSON for public sheets)
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;
                const response = await fetch(url);
                const csvData = await response.text();
                
                // Parse CSV rows
                const rows = csvData.split('\n').map(row => row.split(','));
                
                // Find row by Scenario ID (Column A)
                const match = rows.find(r => r[0].trim() === scenarioID);

                if (match) {
                    document.getElementById('question').innerText = match[1];
                    document.getElementById('textA').innerText = match[2];
                    document.getElementById('textB').innerText = match[3];
                    document.getElementById('textC').innerText = match[4];
                    document.getElementById('textD').innerText = match[5];
                    window.targetAnswer = match[6].trim().toUpperCase();
                } else {
                    document.getElementById('question').innerText = "SCENARIO ID NOT FOUND";
                }
            } catch (e) {
                document.getElementById('question').innerText = "SHEET CONNECTION FAILED";
                console.error(e);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight" && window.targetAnswer) {
                const targetBox = document.getElementById('box' + window.targetAnswer);
                if (targetBox) targetBox.classList.add('correct-glow');
            }
        });

        fetchScenarioData();
    </script>
</body>
</html>
