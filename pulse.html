<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #header { position: absolute; top: 40px; width: 100%; text-align: center; z-index: 10; pointer-events: none; }
        #question { font-size: 36px; color: #ffcc00; font-weight: bold; max-width: 80%; margin: 0 auto; text-shadow: 2px 2px 10px #000; text-transform: uppercase; }
        .container { display: flex; justify-content: space-around; align-items: flex-end; height: 100vh; padding: 0 5% 100px 5%; box-sizing: border-box; }
        .box { width: 22%; border: 2px solid #333; border-radius: 15px; text-align: center; padding: 40px 15px; position: relative; min-height: 140px; background: rgba(20,20,20,0.7); z-index: 5; transition: all 0.5s ease; }
        .label { font-size: 26px; font-weight: 700; line-height: 1.2; text-shadow: 1px 1px 5px #000; }
        .box-letter { font-size: 60px; color: rgba(255,255,255,0.05); position: absolute; bottom: 5px; right: 15px; font-weight: 900; }
        .correct-glow { border-color: #00ff00 !important; box-shadow: 0 0 40px rgba(0, 255, 0, 0.6); background: rgba(0, 255, 0, 0.15) !important; color: #00ff00 !important; }
        canvas { position: absolute; top: 0; left: 0; z-index: 1; }
    </style>
</head>
<body>
    <div id="header"><div id="question">SYNCHRONIZING ARGUS DATA...</div></div>
    <div class="container">
        <div id="boxA" class="box"><div id="textA" class="label"></div><div class="box-letter">A</div></div>
        <div id="boxB" class="box"><div id="textB" class="label"></div><div class="box-letter">B</div></div>
        <div id="boxC" class="box"><div id="textC" class="label"></div><div class="box-letter">C</div></div>
        <div id="boxD" class="box"><div id="textD" class="label"></div><div class="box-letter">D</div></div>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const VOTE_REPORT_URL = "https://script.google.com/macros/s/AKfycbwCyHURg2i1x8uq1-d1QNMpTCWhXsIIo4M9Fh-LpNPvnwZLE0zyZ_BZ388Idn3n0Lzh/exec";
        const SHEET_ID = '16aJUFj5ql8OnEbTOEgHPque-_8L5Ylu4P7VDC4t1CoM';
        const urlParams = new URLSearchParams(window.location.search);
        const scenarioID = urlParams.get('id') || '10SBV01';
        
        let particles = [];
        let revealed = false;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // 1. FETCH SCENARIO TEXT
        async function fetchScenarioData() {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;
                const response = await fetch(url);
                const csvData = await response.text();
                const rows = csvData.split('\n').map(r => r.split(','));
                const match = rows.find(r => r[0].trim() === scenarioID);
                if (match) {
                    document.getElementById('question').innerText = match[1].replace(/"/g, "");
                    document.getElementById('textA').innerText = match[2].replace(/"/g, "");
                    document.getElementById('textB').innerText = match[3].replace(/"/g, "");
                    document.getElementById('textC').innerText = match[4].replace(/"/g, "");
                    document.getElementById('textD').innerText = match[5].replace(/"/g, "");
                    window.targetAnswer = match[6].trim().toUpperCase().replace(/"/g, "");
                }
            } catch (e) { console.error("Scenario Fetch Error", e); }
        }

        // 2. PARTICLE ENGINE
        function initParticles() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            for(let i=0; i<150; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random()-0.5) * 1.5,
                    vy: (Math.random()-0.5) * 1.5,
                    targetX: null,
                    targetY: null
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffcc00';
            particles.forEach(p => {
                if (revealed && p.targetX) {
                    p.x += (p.targetX - p.x) * 0.07;
                    p.y += (p.targetY - p.y) * 0.07;
                } else {
                    p.x += p.vx; p.y += p.vy;
                    if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }

        // 3. THE REVEAL (Logic for actual vote distribution)
        async function revealVotes() {
            if (revealed) return;
            
            // 1. Visually lock the reveal
            revealed = true;
            document.getElementById('question').innerText = "CALCULATING VOTES...";
            
            if (window.targetAnswer) {
                document.getElementById('box' + window.targetAnswer).classList.add('correct-glow');
            }

            try {
                // 'redirect: follow' is the secret sauce for Google Scripts
                const resp = await fetch(`${VOTE_REPORT_URL}?id=${scenarioID}`, {
                    method: "GET",
                    redirect: "follow" 
                });

                if (!resp.ok) throw new Error("Network response was not ok");
                
                const counts = await resp.json();
                console.log("Actual Votes Received:", counts);

                const totalVotes = counts.A + counts.B + counts.C + counts.D;
                
                // Update the Header to show total count
                document.getElementById('question').innerText = `DEBRIEF: ${totalVotes} RESPONSES`;

                if (totalVotes === 0) {
                    console.log("No votes found for this scenario.");
                    return;
                }

                let pIndex = 0;
                ['A', 'B', 'C', 'D'].forEach(letter => {
                    const share = counts[letter] / totalVotes;
                    const numParticles = Math.floor(share * particles.length);
                    const rect = document.getElementById('box' + letter).getBoundingClientRect();
                    
                    for (let i = 0; i < numParticles; i++) {
                        if (particles[pIndex]) {
                            particles[pIndex].targetX = rect.left + (Math.random() * rect.width);
                            particles[pIndex].targetY = rect.top + (Math.random() * rect.height);
                            pIndex++;
                        }
                    }
                });

            } catch (e) {
                document.getElementById('question').innerText = "VOTE FETCH FAILED";
                console.error("Critical Error:", e);
                
                // Fallback: If data fails, just scatter them randomly so the screen isn't frozen
                particles.forEach(p => {
                    const randomBox = ['A','B','C','D'][Math.floor(Math.random()*4)];
                    const rect = document.getElementById('box' + randomBox).getBoundingClientRect();
                    p.targetX = rect.left + (Math.random() * rect.width);
                    p.targetY = rect.top + (Math.random() * rect.height);
                });
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight") revealVotes();
        });

        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

        initParticles();
        animate();
        fetchScenarioData();
    </script>
</body>
</html>
