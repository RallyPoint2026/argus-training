<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rally Point Training</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .header { position: absolute; top: 30px; text-align: center; width: 100%; }
        .logo-text { color: #ffcc00; font-size: 24px; font-weight: 900; letter-spacing: -1px; margin-bottom: 5px; }
        .scenario-label { color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; }
        
        .grid { 
    display: grid; 
    grid-template-columns: 1fr; 
    gap: 15px; 
    width: 85%; 
    max-width: 400px; 
    margin-top: 120px; /* Increased from 60px to clear the header */
    transition: opacity 0.3s; 
}
        
        .btn { height: 90px; border-radius: 15px; border: 2px solid #333; font-size: 32px; font-weight: 800; color: white; background: #1a1a1a; transition: all 0.1s; }
        .btn:active { transform: scale(0.95); background: #333; }
        
        /* Highlight colors for buttons */
        .btn-a:active { border-color: #d32f2f; color: #d32f2f; }
        .btn-b:active { border-color: #1976d2; color: #1976d2; }
        .btn-c:active { border-color: #388e3c; color: #388e3c; }
        .btn-d:active { border-color: #fbc02d; color: #fbc02d; }

        #status { margin-top: 40px; font-size: 16px; color: #666; text-align: center; padding: 0 20px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-text">RALLY POINT TRAINING</div>
        <div class="scenario-label" id="scenarioDisplay">SCENARIO: LOADING...</div>
    </div>

    <div id="voteContainer" class="grid">
        <button class="btn btn-a" onclick="submitVote('A')">A</button>
        <button class="btn btn-b" onclick="submitVote('B')">B</button>
        <button class="btn btn-c" onclick="submitVote('C')">C</button>
        <button class="btn btn-d" onclick="submitVote('D')">D</button>
    </div>

    <div id="status">Tap a button to vote.</div>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycby-NiFEJYihMg2WdOY1ZXto-1vHDj9jydxd6aU2bm9l8U42Ul2eqA3fJM7qPVloiGXyrQ/exec";
        
        const urlParams = new URLSearchParams(window.location.search);
        const scenarioID = urlParams.get('id') || "10SBV01";
        document.getElementById('scenarioDisplay').innerText = "SCENARIO: " + scenarioID;

        // Swipe to reset logic
        let touchstartY = 0;
        window.addEventListener('touchstart', e => touchstartY = e.changedTouches[0].screenY);
        window.addEventListener('touchend', e => {
            if (e.changedTouches[0].screenY > touchstartY + 100) {
                location.reload(); // Refresh page on swipe down
            }
        });

       function submitVote(choice) {
            const statusDiv = document.getElementById('status');
            const container = document.getElementById('voteContainer');

            // 1. Immediately "Lock" the screen so they can't vote twice
            container.style.opacity = "0.1";
            container.style.pointerEvents = "none";
            statusDiv.innerHTML = "<span style='color:#00ff00; font-weight:bold;'>VOTE RECORDED</span><br>Swipe down to reset.";

            // 2. Send the data in the background
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ scenarioID: scenarioID, vote: choice })
            });
        }
    </script>
</body>
</html>
