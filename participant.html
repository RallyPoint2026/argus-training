<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rally Point Training Participant</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .header { border-bottom: 2px solid #FF0000; padding: 10px; font-weight: bold; letter-spacing: 2px; margin-bottom: 30px; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .vote-btn { 
            background: #000; border: 2px solid #fff; color: #fff; 
            padding: 50px 0; font-size: 30px; font-weight: bold; border-radius: 8px;
        }
        .vote-btn:active { background: #FF0000; border-color: #FF0000; }
        #msg { margin-top: 30px; color: #888; text-transform: uppercase; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">RALLY POINT TRAINING</div>
    <div id="instruction">SELECT YOUR RESPONSE</div>
    
    <div class="btn-grid">
        <button class="vote-btn" onclick="castVote('A')">A</button>
        <button class="vote-btn" onclick="castVote('B')">B</button>
        <button class="vote-btn" onclick="castVote('C')">C</button>
        <button class="vote-btn" onclick="castVote('D')">D</button>
    </div>

    <div id="msg">Awaiting next scenario...</div>

   <script>
    const GOOGLE_URL = "your_url_here";

    function castVote(choice) {
        // 1. Check if they already voted for this scenario
        // We'll use a unique ID for each slide later (e.g., 'S1')
        const currentScenario = "S1"; 
        if (localStorage.getItem("voted_" + currentScenario)) {
            alert("Vote already recorded for this scenario.");
            return;
        }

        // 2. Send the data
        fetch(GOOGLE_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                scenarioId: currentScenario,
                activeHeartbeats: 1, 
                correctVotes: (choice === 'B' ? 1 : 0)
            })
        });

        // 3. Lock it locally
        localStorage.setItem("voted_" + currentScenario, "true");

        // 4. Visual feedback
        document.getElementById('instruction').innerText = "VOTE RECORDED";
        document.querySelectorAll('.vote-btn').forEach(b => b.style.opacity = "0.2");
    }
</script>
       </body>
</html>
